# The Unity packages' test suite, run with the .NET SDK alone: no Unity editor,
# no licence, no secrets. See unity/README.md.
name: Unity packages

on:
  push:
    paths: ['unity/**', '.github/workflows/unity-tests.yml']
  pull_request:
    paths: ['unity/**', '.github/workflows/unity-tests.yml']

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Every asset has its .meta
        run: python3 unity/tools/meta.py --check
      - name: Headless tests (behaviour, stub compile, package layout)
        run: dotnet test unity/Headless/Triband.Storey.Tests --logger "console;verbosity=normal"
      - name: The engine-facing code as a player and for iOS compile it (stubs; the tests built the editor's)
        run: |
          for b in "-p:Player=true" "-p:Ios=true" "-p:Player=true -p:Ios=true"; do
            dotnet build unity/Headless/Triband.Storey.Stubs -c Release $b
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: The shaders compile (Storey's HLSL against URP stubs, with Slang)
        run: |
          pip install slangpy==0.43.1
          python3 unity/tools/shaders/check.py
