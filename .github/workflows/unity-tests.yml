# The Unity packages' test suite, run with the .NET SDK alone: no Unity editor,
# no licence, no secrets. See unity/README.md.
name: Unity packages

on:
  push:
    paths: ['unity/**', '.github/workflows/unity-tests.yml']
  pull_request:
    paths: ['unity/**', '.github/workflows/unity-tests.yml']

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Every asset has its .meta
        run: python3 unity/tools/meta.py --check
      - name: Headless tests (behaviour, stub compile, package layout)
        run: dotnet test unity/Headless/Triband.Storey.Tests --logger "console;verbosity=normal"
