<title>Storey Builder</title>
<meta name="description" content="Prototype of a building creation workflow: footprint, facade, floors, interiors, stairs and lifts, and dynamic floor occlusion in play mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#EEF0EB; --panel:#FAFBF8; --ink:#1C2320; --muted:#5F6A64; --line:#D6DBD3; --well:#ECEFE9;
  --accent:#DD5A12; --accent-ink:#FFFFFF; --accent-soft:#F8E1D2; --danger:#B8352A; --ok:#2F7D4F;
  --shadow:0 1px 2px rgba(18,28,23,.07),0 10px 28px rgba(18,28,23,.12);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151917; --panel:#1B201E; --ink:#E6EAE6; --muted:#98A29C; --line:#2E3531; --well:#232926;
  --accent:#FF7C33; --accent-ink:#1B0D04; --accent-soft:#3A2519; --danger:#F07166; --ok:#6BC28F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#151917; --panel:#1B201E; --ink:#E6EAE6; --muted:#98A29C; --line:#2E3531; --well:#232926;
  --accent:#FF7C33; --accent-ink:#1B0D04; --accent-soft:#3A2519; --danger:#F07166; --ok:#6BC28F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark;}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* top bar */
#top{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;pointer-events:none;z-index:20}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;font-weight:700;letter-spacing:.01em}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.modes{display:flex;padding:3px;gap:2px;height:40px;box-sizing:border-box}
.modes button{border:0;background:transparent;padding:0 14px;border-radius:7px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.modes button.on{background:var(--ink);color:var(--panel)}
.modes button.play.on{background:var(--accent);color:var(--accent-ink)}
.tb{display:flex;height:40px;box-sizing:border-box;padding:3px;gap:2px}
.ib{border:0;background:transparent;min-width:34px;height:34px;border-radius:7px;cursor:pointer;display:grid;place-items:center;padding:0 8px}
.ib:hover{background:var(--well)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib:focus-visible,.modes button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
/* side panel */
#panel{position:absolute;left:12px;top:calc(62px + env(safe-area-inset-top,0px));max-height:calc(100% - 74px);width:292px;overflow:auto;z-index:10;display:flex;flex-direction:column}
#panel .sec{padding:14px 14px}
#panel .sec+.sec{border-top:1px solid var(--line)}
#panel .sec:last-child{border-bottom:0}
.h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.h .grow{flex:1}
.blist{display:flex;flex-direction:column;gap:2px}
.brow{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:7px;cursor:pointer;width:100%}
.brow:hover{background:var(--well)}
.brow.on{background:var(--accent-soft)}
.brow .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.brow .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .fl{color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:var(--well);border-radius:8px}
.tabs button{border:0;background:transparent;padding:7px 0;border-radius:6px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.name{width:100%;box-sizing:border-box;border:1px solid transparent;background:transparent;font:600 17px/1.2 var(--sans);color:var(--ink);padding:4px 6px;margin:-4px -6px 8px;border-radius:6px}
.name:hover,.name:focus{border-color:var(--line);outline:none;background:var(--well)}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:var(--well);border-radius:7px}
.seg button{flex:1;border:0;background:transparent;padding:6px 6px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.field{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:8px 0}
.field>span{color:var(--muted);font-size:12px}
.sl{display:grid;grid-template-columns:92px 1fr 52px;gap:8px;align-items:center;margin:6px 0}
.sl>span{color:var(--muted);font-size:12px}
.sl output{font-family:var(--mono);font-size:12px;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.sws{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.swb{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.swb.on{outline:2px solid var(--ink);outline-offset:1px}
input[type=color]{width:26px;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:transparent;cursor:pointer}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center}
.preset:hover{border-color:var(--muted)}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.preset i{display:flex;flex-direction:column;width:18px;height:26px;border-radius:3px;overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.15)}
.preset i b{flex:1}
.preset span{font-size:12px;font-weight:600;line-height:1.15}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;position:relative}
.tool:hover{border-color:var(--muted)}
.tool.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tool kbd{position:absolute;top:3px;right:4px;font:600 9px var(--mono);opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.shape{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500}
.shape:hover{border-color:var(--muted)}
.shape svg{width:28px;height:28px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.stat{background:var(--well);border-radius:7px;padding:6px 8px}
.stat b{display:block;font:600 14px var(--mono)}
.stat span{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0;text-wrap:pretty}
.insp{background:var(--well);border-radius:8px;padding:10px;margin-top:10px}
.insp .t{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;margin:6px 0;font-size:12.5px}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
/* floor stack */
#stack{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top,0px));width:164px;z-index:10;display:flex;flex-direction:column;max-height:calc(100% - 140px)}
#stack .hd{padding:10px 10px 8px;border-bottom:1px solid var(--line)}
#stack .cnt{display:flex;align-items:center;gap:4px;margin-top:6px}
#stack .cnt input{width:100%;min-width:0;text-align:center;font:600 16px var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--well);color:var(--ink);padding:4px 0}
#stack .cnt .ib{border:1px solid var(--line);height:32px;min-width:32px;padding:0}
.floors{overflow:auto;padding:4px;flex:1;min-height:60px}
.frow{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 3px;border-radius:7px;cursor:pointer;position:relative}
.frow:hover{background:var(--well)}
.frow.on{background:var(--ink);color:var(--panel)}
.frow .num{width:30px;height:24px;display:grid;place-items:center;border-radius:5px;font:600 12px var(--mono);background:var(--well);color:var(--ink);flex:none}
.frow.on .num{background:var(--accent);color:var(--accent-ink)}
.frow .lb{flex:1;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden}
.frow .lb em{font-style:normal;opacity:.6;font-size:11px}
.frow .acts{display:none;gap:1px}
.frow:hover .acts,.frow.on .acts{display:flex}
.frow .acts button{border:0;background:transparent;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:inherit;opacity:.75;padding:0}
.frow .acts button:hover{opacity:1;background:rgba(127,127,127,.25)}
#stack .ft{padding:8px 10px;border-top:1px solid var(--line)}
/* overlay handles */
#ov{position:absolute;inset:0;pointer-events:none;z-index:5}
.hd-v,.hd-m,.hd-c,.hd-s{position:absolute;left:0;top:0;pointer-events:auto;touch-action:none;will-change:transform}
.hd-v{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);box-sizing:border-box;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.hd-v::after{content:"";position:absolute;inset:-10px}
.hd-v.sel{background:var(--accent)}
.hd-m{opacity:.8;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:rgba(255,255,255,.85);color:#DD5A12;display:grid;place-items:center;font:700 14px/1 var(--sans);cursor:copy;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.hd-m::after{content:"";position:absolute;inset:-8px}
.hd-c{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:8px;background:var(--ink);color:var(--panel);display:grid;place-items:center;cursor:move;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hd-s{width:30px;height:30px;margin:-30px 0 0 -15px;cursor:move;display:grid;place-items:center}
.len{position:absolute;left:0;top:0;transform-origin:0 0;font:600 11px var(--mono);background:rgba(28,35,32,.82);color:#fff;padding:2px 5px;border-radius:4px;white-space:nowrap;pointer-events:none;margin:-9px 0 0 -20px}
#tip{position:absolute;pointer-events:none;z-index:30;font:600 12px var(--mono);background:var(--ink);color:var(--panel);padding:3px 7px;border-radius:5px;white-space:nowrap}
/* hint */
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;padding:7px 12px;font-size:12px;color:var(--muted);max-width:min(560px,calc(100% - 660px));text-align:center;text-wrap:balance}
#toast{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;font-size:12.5px;box-shadow:var(--shadow);transition:opacity .2s;opacity:0;pointer-events:none}
#toast.show{opacity:1}
/* play HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:12}
#hud>*{pointer-events:auto}
#loc{position:absolute;left:12px;top:calc(62px + env(safe-area-inset-top,0px));display:flex;align-items:stretch;overflow:hidden}
#loc .d{background:#101412;color:#FFB36B;font:600 26px/1 var(--mono);padding:8px 12px;min-width:48px;text-align:center;letter-spacing:.02em;display:grid;place-items:center}
#loc .t{padding:7px 12px;display:flex;flex-direction:column;justify-content:center}
#loc .t b{font-size:14px}
#loc .t span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#occ{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top,0px));width:250px;padding:12px}
#occ .h{margin-bottom:6px}
#joy{position:absolute;left:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(20,26,23,.28);border:2px solid rgba(255,255,255,.55);touch-action:none;backdrop-filter:blur(2px)}
#joy .k{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#lift{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 14px;max-width:calc(100% - 220px)}
#lift .h{justify-content:center}
#lift .btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:360px}
#lift button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--well);font:600 13px var(--mono);cursor:pointer;color:var(--ink)}
#lift button:hover{border-color:var(--accent)}
#lift button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#phint{position:absolute;left:50%;transform:translateX(-50%);top:calc(62px + env(safe-area-inset-top,0px));font-size:12px;color:var(--muted);padding:6px 12px;white-space:nowrap}
/* modal */
#modal{position:absolute;inset:0;z-index:50;background:rgba(10,14,12,.45);display:grid;place-items:center;padding:16px}
#modal .card{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px}
#modal h2{margin:0 0 10px;font-size:18px;text-wrap:balance}
#modal table{width:100%;border-collapse:collapse;font-size:12.5px}
#modal td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
#modal td:first-child{white-space:nowrap;width:40%}
kbd{font:600 11px var(--mono);background:var(--well);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
#modal textarea{width:100%;box-sizing:border-box;height:260px;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;background:var(--well);color:var(--ink);padding:8px}

.bsw{padding:10px 10px 12px!important}
.bswb{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;margin-bottom:10px}
.bswb:hover{border-color:var(--muted)}
.bswb .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.bswb .nm{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bswb .fl{color:var(--muted);font-size:11.5px}
.bswb .chev{color:var(--muted);flex:none}
.menu .name{margin:0 0 4px}
.sub-h{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.sec>.sub-h:first-child,.menu>.sub-h:first-child{margin-top:4px}
.lead{margin:0 0 4px;color:var(--muted);font-size:12.5px;text-wrap:pretty}
.tstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:3px;background:var(--well);border-radius:9px}
.tstrip button{border:0;background:transparent;height:36px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.tstrip button:hover{background:var(--panel)}
.tstrip button.on{background:var(--ink);color:var(--panel)}
.tstrip button:focus-visible,.seg button:focus-visible,.shape:focus-visible,.preset:focus-visible,.bswb:focus-visible,.frow button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.toolname{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 0;font-size:13px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);padding:2px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:0;height:0;border:4px solid transparent;border-left:5px solid currentColor;transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg);transform-origin:2px 4px}
details.more[open] summary{margin-bottom:6px}
#stack.compact{max-height:none}
#stack.compact .hd{border-bottom:0}
.field .sws{flex-wrap:nowrap}
.swb{width:21px;height:21px}
.len{display:none}
#ov.dragging .len{display:block}
#panelToggle{display:none;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--well);padding:8px 14px;font-weight:600;cursor:pointer;text-align:left;align-items:center;gap:8px;position:sticky;top:0;z-index:2;color:var(--ink)}
.brand span{white-space:nowrap}
#occ .h{cursor:pointer;user-select:none}
#occ.closed>*:not(.h){display:none}
#occ.closed .h{margin:0}
#occ.closed{width:auto}
@media (max-width:760px){
  .brand small,.modes .lbl,.brand span{display:none}
  .brand{padding:0 8px}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:44%}
  #panel.collapsed{max-height:40px;overflow:hidden}
  #panelToggle{display:flex}
  #stack{right:8px;top:calc(58px + env(safe-area-inset-top,0px));width:132px;max-height:34%}
  #stack .ft{display:none}
  #hint{display:none}
  #occ{width:200px;right:8px;padding:10px;top:calc(116px + env(safe-area-inset-top,0px))}
  #occ .sl{grid-template-columns:60px 1fr 40px}
  #lift{max-width:calc(100% - 24px);bottom:calc(176px + env(safe-area-inset-bottom,0px))}
  #phint{display:none}
  #loc{left:8px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <canvas id="c" tabindex="0" aria-label="3D building viewport"></canvas>
  <div id="ov"></div>
  <div id="tip" hidden></div>

  <div id="top">
    <div class="card brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="12" width="16" height="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="6" width="12" height="6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8" y="2" width="6" height="4" fill="#DD5A12"/></svg>
      <span>Storey Builder</span><small>prototype</small>
    </div>
    <div class="card modes" role="tablist" aria-label="Mode">
      <button id="mEdit" class="on" role="tab"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 10.5 9.5 3l1.5 1.5L3.5 12H2z" fill="currentColor"/></svg><span class="lbl">Edit</span></button>
      <button id="mPlay" class="play" role="tab"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 2v10l8-5z" fill="currentColor"/></svg><span class="lbl">Play</span></button>
    </div>

let DEBUG_SOLIDS=false;
function buildGeometry(b){
  const N=b.floors.length, fp=b.footprint, shell=b.interior===false;
  const ccw = area2(fp) > 0;
  const Wp = fp.map(p=>[p.x+b.pos.x, p.z+b.pos.z]);
  const cor = corners(fp, ccw);
  const st=b.style;
  const C = { wall:col(st.wall), trim:col(st.trim), inner:col(st.interior), core:col(st.core), coreIn:shade(st.core,1.08), liftIn:col('#8E9A9E'),
    step:shade(st.core,0.82), glass:col(st.glass), metal:col('#A3ABAE'), rail:col('#3D4448'), doorTrim:shade(st.interior,0.72), plinth:shade(st.wall,0.72) };
  const levels=[], segs=[];
  for(let k=0;k<=N;k++){
    const op=new GB(), gl=new GB(), sg=[]; if(DEBUG_SOLIDS) op.solids=[];
    if(!shell || k===0 || k===N) buildSlab(op,b,k,Wp,C,shell);
    if(k<N){ buildFacade(op,gl,sg,b,k,Wp,ccw,cor,C,shell); if(!shell){ buildInterior(op,sg,b,k,C); buildProps(op,sg,b,k); } }
    else buildRoof(op,sg,b,Wp,ccw,cor,C);
    if(!shell) buildShafts(op,sg,b,k,C);
    levels.push({op,gl}); segs.push(sg);
  }
  return {levels, segs};
}

function nearestEdge(b,p,maxD){ const fp=b.footprint; let best=null; for(let i=0;i<fp.length;i++){ const a=fp[i], c=fp[(i+1)%fp.length]; const r=segDist(p.x,p.z,a.x,a.z,c.x,c.z); if(r.d<maxD && (!best||r.d<best.d)) best={i,d:r.d,t:r.t,L:Math.hypot(c.x-a.x,c.z-a.z)}; } return best; }

const blankFloor = () => ({walls:[],props:[]});
function addFloorTop(b){ const top=b.floors[b.floors.length-1]; b.floors.push(ui.copyOnAdd ? clone(top) : blankFloor()); }
function insertAbove(b,k){ b.floors.splice(k+1,0,clone(b.floors[k])); for(const s of b.shafts){ if(s.bottom>k) s.bottom++; if(s.top>=0 && s.top>k) s.top++; } }
function deleteFloor(b,k){
  if(b.floors.length<=1) return false;
  b.floors.splice(k,1);
  b.shafts = b.shafts.filter(s=>!(s.bottom===k && s.top===k));
  for(const s of b.shafts){ if(s.bottom>k) s.bottom--; if(s.top>=0 && s.top>=k) s.top=Math.max(s.bottom, s.top-1); s.bottom=Math.min(s.bottom, b.floors.length-1); }
  return true;
}

/* =========================================================================
   Footprint editing (edge-index bookkeeping for entrances & blank walls)
   ========================================================================= */
function insertVertex(b,i){
  const fp=b.footprint, a=fp[i], c=fp[(i+1)%fp.length];
  fp.splice(i+1,0,P(snapG((a.x+c.x)/2), snapG((a.z+c.z)/2)));
  b.entrances=b.entrances.map(e=> e.edge>i ? {...e,edge:e.edge+1} : e.edge===i ? (e.t<0.5 ? {edge:i,t:e.t*2} : {edge:i+1,t:(e.t-0.5)*2}) : e);
  b.blank=b.blank.flatMap(j=> j>i ? [j+1] : j===i ? [i,i+1] : [j]);
  return i+1;
}
function removeVertex(b,i){
  const fp=b.footprint; if(fp.length<=3) return false; const n=fp.length;
  const prev=(i-1+n)%n;
  fp.splice(i,1);
  const remap = j => j>i ? j-1 : j;
  b.entrances=b.entrances.filter(e=>e.edge!==i && e.edge!==prev).map(e=>({...e,edge:remap(e.edge)}));
  b.blank=[...new Set(b.blank.filter(j=>j!==i).map(remap))].filter(j=>j<fp.length);
  return true;
}
function applyShape(b,key){
  b.footprint=FOOTPRINTS[key]().map(([x,z])=>P(x,z)); b.entrances=[{edge:0,t:0.5}]; b.blank=[];
  b.shafts=b.shafts.filter(s=>{ const h=itemHalf(s,0.16); return rectInside(b.footprint,s.x,s.z,h.hx,h.hz); });
}
function rotate90(b){
  const bb=bbox(b.footprint), cx=(bb.x0+bb.x1)/2, cz=(bb.z0+bb.z1)/2;
  const R = p => P(cx-(p.z-cz), cz+(p.x-cx));
  b.footprint=b.footprint.map(R);
  for(const f of b.floors){ f.walls=f.walls.map(w=>({...w,a:R(w.a),b:R(w.b)})); f.props=f.props.map(p=>({...p,...R(p),rot:(p.rot+1)%4})); }
  b.shafts=b.shafts.map(s=>({...s,...R(s),rot:(s.rot+1)%4}));
}

const keys = {};

function surfaceAt(x,z,y){
  let best = y+0.6 >= 0 ? 0 : -1e9;
  for(const b of state.buildings){
    const lx=x-b.pos.x, lz=z-b.pos.z; if(!pip(b.footprint,lx,lz)) continue;
    const N=b.floors.length;
    for(let k=0;k<=N;k++){ const yk=floorBase(b,k); if(yk>y+0.6 || yk<=best) continue;
      if(b.shafts.some(s=>stairHoleAt(b,s,k) && (()=>{ const q=toItem(s,lx,lz); return Math.abs(q.x)<1.3 && q.z>-1.6 && q.z<2.6; })())) continue; best=yk; }
    for(const s of b.shafts){ if(s.type!=='stairs') continue; const q=toItem(s,lx,lz); if(Math.abs(q.x)>=1.3 || q.z<=-1.6 || q.z>=2.6) continue;
      for(let k=s.bottom;k<=N;k++){ if(!hasFlight(b,s,k)) continue; const yb=floorBase(b,k), half=floorH(b,k)/2; let hy;
        if(q.z>=1.6) hy=yb+half; else if(q.x<0) hy=yb+(q.z+1.6)/3.2*half; else hy=yb+half+(1.6-q.z)/3.2*half;
        if(hy<=y+0.6 && hy>best) best=hy; } }
  }
  return best;
}
function collide(px,pz,y){
  const segs=[];
  for(const b of state.buildings){ const r=recs.get(b.id); if(!r) continue; const bb=bbox(b.footprint); if(px<bb.x0+b.pos.x-3||px>bb.x1+b.pos.x+3||pz<bb.z0+b.pos.z-3||pz>bb.z1+b.pos.z+3) continue; if(y>roofY(b)+2) continue; const k=floorAtY(b,y); if(r.segs[k]) segs.push(...r.segs[k]); }
  for(let it=0;it<4;it++) for(const s of segs){ const q=segDist(px,pz,s.ax,s.az,s.bx,s.bz); const rr=PR+s.r; if(q.d<rr){ if(q.d<1e-5){ px+=rr; continue; } px=q.cx+(px-q.cx)/q.d*rr; pz=q.cz+(pz-q.cz)/q.d*rr; } }
  return [px,pz];
}
function liftHere(){
  const loc=playerLoc(); if(!loc.b) return null;
  for(const s of loc.b.shafts){ if(s.type!=='lift') continue; const q=toItem(s,player.x-loc.b.pos.x,player.z-loc.b.pos.z); if(Math.abs(q.x)<1.2 && Math.abs(q.z)<1.2 && shaftLevels(loc.b,s).includes(loc.floor)) return {b:loc.b,s,floor:loc.floor}; }

}

}

function updatePlayer(dt){
  if(player.ride){
    const r=player.ride, d=r.to-player.y, sp=4.5*dt;
    player.y = Math.abs(d)<=sp ? r.to : player.y+Math.sign(d)*sp;
    if(player.y===r.to){ player.ride=null; liftKey=''; }
    if(!carMesh){ carMesh=new THREE.Mesh(carGB.geo(), recs.get(r.b.id).mats.opaque); scene.add(carMesh); }
    const f=frame(r.b,r.s); carMesh.position.set(f.O[0],player.y,f.O[1]); carMesh.rotation.y=-r.s.rot*Math.PI/2; carMesh.visible=true;
  } else if(carMesh){ carMesh.visible=false; }
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0), iy=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  if(joy.id!==null){ ix=joy.x; iy=joy.y; }
  let m=Math.hypot(ix,iy); if(m>1){ ix/=m; iy/=m; m=1; }
  if(player.ride) m=0;
  if(m>0.05){
    const fx=-Math.sin(camPlay.yaw), fz=-Math.cos(camPlay.yaw), rx=-fz, rz=fx;
    const mx=(fx*iy+rx*ix), mz=(fz*iy+rz*ix), sp=(keys.ShiftLeft?7:4.4)*dt;
    const steps=Math.ceil(sp*Math.max(Math.abs(mx),Math.abs(mz))/0.12)||1;
    for(let s=0;s<steps;s++){
      const nx=player.x+mx*sp/steps, nz=player.z+mz*sp/steps; const [cx,cz]=collide(nx,nz,player.y);
      const sy=surfaceAt(cx,cz,player.y); if(sy>player.y+0.6) break;
      player.x=cx; player.z=cz;
    }
    const tf=Math.atan2(mx,mz); let dA=tf-player.face; dA=Math.atan2(Math.sin(dA),Math.cos(dA)); player.face+=dA*Math.min(1,dt*12);
    player.walk+=dt*m*9;
  } else player.walk*=0.8;
  if(!player.ride){
    const sy=surfaceAt(player.x,player.z,player.y);
    if(sy<player.y-0.02){ player.vy-=24*dt; player.y=Math.max(sy, player.y+player.vy*dt); if(player.y<=sy+0.6 && player.y-sy<0.25 && player.vy<0) {} }
    else { player.y=sy; player.vy=0; }
    if(player.y===sy) player.vy=0;
  }
  pGroup.position.set(player.x,player.y,player.z); pGroup.rotation.y=player.face;
  const sw=Math.sin(player.walk)*0.35*Math.min(1,m*2); pGroup.userData.legs[0].rotation.x=sw; pGroup.userData.legs[1].rotation.x=-sw;
  pSil.position.copy(pGroup.position); pSil.rotation.y=player.face; pSil.visible=ui.occ.silhouette;
  const t=camPlay.target, k=Math.min(1,dt*10); t.x+=(player.x-t.x)*k; t.y+=(player.y+1.2-t.y)*k; t.z+=(player.z-t.z)*k;
}

function snapWallPt(b,k,p,from){
  const cands=[]; for(const w of b.floors[k].walls) cands.push(w.a,w.b); for(const v of b.footprint) cands.push(v);
  let best=null, bd=0.45; for(const c of cands){ const d=Math.hypot(c.x-p.x,c.z-p.z); if(d<bd){bd=d;best=P(c.x,c.z);} }

  if(from){ const dx=q.x-from.x, dz=q.z-from.z; if(Math.abs(dx)<Math.abs(dz)*0.3) q.x=from.x; else if(Math.abs(dz)<Math.abs(dx)*0.3) q.z=from.z; }
  let eb=null, ed=0.3; const lines=[...b.floors[k].walls.map(w=>[w.a,w.b]), ...b.footprint.map((v,i)=>[v,b.footprint[(i+1)%b.footprint.length]])];

  return q;
}

  const hh=h-SLAB; showHL((a.x+c.x)/2+b.pos.x, y+hh/2+0.02, (a.z+c.z)/2+b.pos.z, L+T_INT+0.02, hh+0.02, T_INT+0.06, [dx/L,dz/L]);

function doorAt(b,k,p){

  erase:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 15h9M3 11l6.5-6.5 4 4L7 15H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  stairs:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 15h4v-4h4V7h4V3h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  lift:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="12" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 7.5 9 5l2.5 2.5M6.5 10.5 9 13l2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  prop:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2.5 9.5h13v3h-13zM3.5 12.5V15M14.5 12.5V15M4 9.5V6a1.5 1.5 0 0 1 1.5-1.5h7A1.5 1.5 0 0 1 14 6v3.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
};
function shapeIcon(key){ const fp=FOOTPRINTS[key](); const xs=fp.map(p=>p[0]), zs=fp.map(p=>p[1]); const s=22/Math.max(Math.max(...xs),Math.max(...zs)); return `<svg viewBox="-3 -3 28 28" aria-hidden="true"><polygon points="${fp.map(([x,z])=>`${(x*s).toFixed(1)},${(z*s).toFixed(1)}`).join(' ')}" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.6"/></svg>`; }
const seg = (path, val, opts) => `<div class="seg">${opts.map(([v,l])=>`<button data-set="${path}" data-val="${v}" class="${String(v)===String(val)?'on':''}">${l}</button>`).join('')}</div>`;
const slider = (path, label, val, min, max, step, unit, dec=1) => `<label class="sl"><span>${label}</span><input type="range" id="in-${path.replace('.','-')}" data-num="${path}" data-unit="${unit}" data-dec="${dec}" min="${min}" max="${max}" step="${step}" value="${val}"><output>${(+val).toFixed(dec)}${unit}</output></label>`;
const swatches = (path, val) => `<div class="sws">${PALETTE[path.split('.')[1]].map(c=>`<button class="swb ${c.toLowerCase()===String(val).toLowerCase()?'on':''}" style="background:${c}" data-set="${path}" data-val="${c}" aria-label="${c}"></button>`).join('')}<input type="color" id="in-${path.replace('.','-')}" data-color="${path}" value="${val}" aria-label="Custom colour"></div>`;

const isShell = b => b.interior===false;
const TOOLS=[['select','Select','V','Move furniture, stairs and lifts · click a wall to select it'],['wall','Wall','W','Click to chain walls · drag for one wall · Esc to finish'],['door','Door','D','Click a wall to add or remove a doorway'],['erase','Erase','X','Click anything on this floor to remove it'],['stairs','Stairs','S','Click to place · runs to the top floor · R rotates'],['lift','Lift','L','Click to place · serves every floor above · R rotates'],['prop','Furnish','F','Click to place · R rotates']];
function renderPanel(){
  if(ui.mode!=='edit') return;
  const b=selB();
  const collapsed=panel.classList.contains('collapsed');
  let h=`<button id="panelToggle" data-act="ptoggle" aria-expanded="${!collapsed}">${collapsed?'▴ Show editor':'▾ Hide editor'}${b?' · '+esc(b.name):''}</button>`;
  // building switcher: one line when closed, list + new building when open
  const open = ui.bmenu || !b;
  h+=`<div class="sec bsw">`;
  if(b) h+=`<button class="bswb" data-act="bmenu" aria-expanded="${open}"><span class="sw" style="background:${b.style.wall}"></span><span class="nm">${esc(b.name)}</span><span class="fl mono">${b.floors.length} fl${isShell(b)?' · shell':''}</span><svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="${open?'M2 8l4-4 4 4':'M2 4l4 4 4-4'}" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>`;
  else h+=`<div class="h">Buildings</div>`;
  if(open){
    h+=`<div class="menu">`;
    if(b) h+=`<label class="sub-h" for="bname">Name</label><input class="name" id="bname" value="${esc(b.name)}">`;
    const others=state.buildings.filter(x=>x.id!==ui.sel);
    if(others.length) h+=`${b?'<div class="sub-h">Switch to</div>':''}<div class="blist">${others.map(x=>`<button class="brow" data-act="sel" data-id="${x.id}"><span class="sw" style="background:${x.style.wall}"></span><span class="nm">${esc(x.name)}</span><span class="fl mono">${x.floors.length} fl</span></button>`).join('')}</div>`;
    h+=`<div class="sub-h">New building</div><div class="shapes">${Object.keys(FOOTPRINTS).map(k=>`<button class="shape" data-act="new" data-shape="${k}" title="New ${SHAPE_LABEL[k]}-shaped building">${shapeIcon(k)}${SHAPE_LABEL[k]}</button>`).join('')}</div>`;
    if(b) h+=`<div class="row" style="margin-top:12px"><button class="btn" data-act="dup" title="Ctrl+D">${I.dup} Duplicate</button><button class="btn danger ghost" data-act="delB">${I.del} Delete</button></div>`;
    h+=`</div></div>`;
    panel.innerHTML=h; updateHint(); return;
  }
  h+=`<div class="tabs" role="tablist">${[['shape','Shape'],['facade','Facade'],['interior','Interior']].map(([t,l],i)=>`<button role="tab" aria-selected="${ui.tab===t}" class="${ui.tab===t?'on':''}" data-act="tab" data-tab="${t}" title="${l} (${i+1})">${l}</button>`).join('')}</div></div>`;

  if(ui.tab==='shape'){
    h+=`<div class="sec"><p class="lead">Drag the corners in the view. Drag a <b>+</b> to add a corner, double-click a corner to remove it.</p>
      <div class="sub-h">Start from</div><div class="shapes">${Object.keys(FOOTPRINTS).map(k=>`<button class="shape" data-act="shape" data-shape="${k}" title="Replace footprint with ${SHAPE_LABEL[k]}">${shapeIcon(k)}${SHAPE_LABEL[k]}</button>`).join('')}</div>
      <div class="sub-h">Storey height</div>${slider('groundHeight','Ground',b.groundHeight,3,6,0.1,' m')}${slider('floorHeight','Upper',b.floorHeight,2.7,4.5,0.1,' m')}
      <div class="row" style="margin-top:10px"><button class="btn" data-act="rot90">Rotate 90°</button><label class="chk" style="margin:0 0 0 auto"><input type="checkbox" id="snapChk" ${ui.snap?'checked':''}> Snap to grid</label></div>
      <p class="note mono">${(Math.abs(area2(b.footprint))/2).toFixed(0)} m² per floor · ${roofY(b).toFixed(1)} m tall</p></div>`;
  }
  if(ui.tab==='facade'){
    const st=b.style;
    h+=`<div class="sec"><div class="presets">${Object.entries(STYLES).map(([k,x])=>`<button class="preset ${st.preset===k?'on':''}" data-act="style" data-style="${k}"><i><b style="background:${x.roof}"></b><b style="background:${x.wall};flex:3"></b><b style="background:${x.trim}"></b></i><span>${x.label}</span></button>`).join('')}</div>
      <div class="sub-h">Windows</div>${seg('style.windows',st.windows,[['none','None'],['punched','Punched'],['tall','Tall'],['ribbon','Ribbon'],['curtain','Glass']])}
      <div class="sub-h">Colours</div>
      <div class="field"><span>Walls</span>${swatches('style.wall',st.wall)}</div>
      <div class="field"><span>Trim</span>${swatches('style.trim',st.trim)}</div>
      <div class="field"><span>Roof</span>${swatches('style.roof',st.roof)}</div>
      <div class="sub-h">Click walls to add</div><div class="seg">${[['entrance','Entrance'],['blank','Blank wall']].map(([t,l])=>`<button data-act="ftool" data-t="${t}" class="${ui.facadeTool===t?'on':''}">${l}</button>`).join('')}</div>
      <details class="more" ${ui.moreOpen?'open':''} id="moreFacade"><summary>More options</summary>
        ${slider('style.winW','Window width',st.winW,0.6,2.4,0.1,' m')}${slider('style.bay','Bay spacing',st.bay,1.4,5,0.1,' m')}
        <div class="field"><span>Ground floor</span>${seg('style.ground',st.ground,[['storefront','Shopfront'],['match','Match'],['solid','Solid']])}</div>
        <label class="chk"><input type="checkbox" data-bool="style.bands" id="bandsChk" ${st.bands?'checked':''}> Floor bands</label>
        <label class="chk"><input type="checkbox" data-bool="style.parapet" id="parChk" ${st.parapet?'checked':''}> Roof parapet</label>
        ${slider('style.units','Roof units',st.units,0,8,1,'',0)}
      </details></div>`;
  }
  if(ui.tab==='interior'){
    const k=activeFloor(b), N=b.floors.length, shell=isShell(b);
    h+=`<div class="sec"><div class="seg" role="group" aria-label="Interior">${[['walk','Walk-in interior'],['shell','Shell only']].map(([v,l])=>`<button data-act="interior" data-v="${v}" class="${(v==='shell')===shell?'on':''}">${l}</button>`).join('')}</div>`;
    if(shell){
      h+=`<p class="lead" style="margin-top:12px">Facade only: windows are opaque, no floors or rooms inside, and the player can't enter. Use it for background blocks. Your floor layouts are kept if you switch back.</p></div>`;
    } else if(k===N){
      h+=`<div class="sub-h">Roof access</div>`;
      if(!b.shafts.length) h+=`<p class="note">No stairs or lifts yet. Pick a floor on the right, then place stairs.</p>`;
      b.shafts.forEach((x,i)=>{ const reach=shaftTop(b,x)===N-1; h+=`<label class="chk"><input type="checkbox" data-act="shRoofI" data-id="${x.id}" ${x.roof?'checked':''} ${reach?'':'disabled'}> ${x.type==='stairs'?'Stairs':'Lift'} ${i+1} <span class="note mono" style="margin:0">${floorShort(b,x.bottom)}–${floorShort(b,shaftTop(b,x))}</span></label>`; });
      h+=`</div>`;
    } else {
      const cur=TOOLS.find(t=>t[0]===ui.tool)||TOOLS[0];
      h+=`<div class="tstrip" role="toolbar" aria-label="Interior tools">${TOOLS.map(([t,l,kb])=>`<button class="${ui.tool===t?'on':''}" data-act="tool" data-t="${t}" title="${l} (${kb})" aria-label="${l}" aria-pressed="${ui.tool===t}">${TOOL_ICONS[t]}</button>`).join('')}</div>
        <div class="toolname"><b>${cur[1]}</b><kbd>${cur[2]}</kbd></div><p class="note" style="margin-top:2px">${cur[3]}</p>`;
      if(ui.tool==='prop') h+=`<div class="chips" style="margin-top:8px">${Object.entries(PROPS).map(([t,p])=>`<button class="chip ${ui.propType===t?'on':''}" data-act="ptype" data-t="${t}">${p.label}</button>`).join('')}</div>`;
      if(ui.sub) h+=inspector(b);
      h+=`<details class="more" ${ui.moreOpen?'open':''} id="moreInt"><summary>Interior colours</summary>
        <div class="field"><span>Walls</span>${swatches('style.interior',b.style.interior)}</div>
        <div class="field"><span>Floors</span>${swatches('style.floor',b.style.floor)}</div></details></div>`;
    }
  }
  panel.innerHTML=h; updateHint();
}
function inspector(b){
  const s=ui.sub;
  if(s.kind==='shaft'){ const sh=b.shafts.find(x=>x.id===s.id); if(!sh) return ''; const N=b.floors.length;
    const opts=k=>Array.from({length:N},(_,i)=>`<option value="${i}" ${i===k?'selected':''}>${floorLabel(b,i)}</option>`).join('');
    return `<div class="insp"><div class="t">${TOOL_ICONS[sh.type==='stairs'?'stairs':'lift']} ${sh.type==='stairs'?'Stairs':'Lift'}</div>
      <div class="field"><span>From</span><select id="shBottom" data-sh="bottom">${opts(sh.bottom)}</select></div>
      <div class="field"><span>To</span><select id="shTop" data-sh="top"><option value="-1" ${sh.top<0?'selected':''}>Top floor</option>${opts(sh.top<0?-9:sh.top)}</select></div>
      <label class="chk"><input type="checkbox" data-act="shRoof" ${sh.roof?'checked':''}> Continue to the roof</label>
      <div class="row"><button class="btn" data-act="subRot">Rotate</button><button class="btn danger ghost" data-act="subDel">${I.del} Remove</button></div></div>`; }
  if(s.kind==='prop'){ const p=b.floors[s.floor]?.props[s.i]; if(!p) return ''; return `<div class="insp"><div class="t">${PROPS[p.type].label}</div><div class="row"><button class="btn" data-act="subRot">Rotate</button><button class="btn danger ghost" data-act="subDel">${I.del} Remove</button></div></div>`; }
  if(s.kind==='wall'){ const w=b.floors[s.floor]?.walls[s.i]; if(!w) return ''; const L=Math.hypot(w.b.x-w.a.x,w.b.z-w.a.z); return `<div class="insp"><div class="t">Wall <span class="mono note" style="margin:0">${L.toFixed(2)} m</span></div><div class="row"><button class="btn danger ghost" data-act="subDel">${I.del} Remove</button></div></div>`; }
  return '';
}
function renderStack(){
  const b=selB();
  if(ui.mode!=='edit' || !b || ui.bmenu){ stackEl.hidden=true; return; }
  stackEl.hidden=false;
  const N=b.floors.length, k=activeFloor(b), list = ui.tab==='interior' && !isShell(b);
  stackEl.classList.toggle('compact', !list);
  let h=`<div class="hd"><div class="h" style="margin:0">Floors</div><div class="cnt"><button class="ib" data-act="fRemove" title="Remove top floor (−)" aria-label="Remove top floor" ${N<=1?'disabled':''}>${I.minus}</button><input id="fcount" type="number" min="1" max="40" value="${N}" aria-label="Number of floors"><button class="ib" data-act="fAdd" title="Add a floor on top, copying the top floor (+)" aria-label="Add floor">${I.plus}</button></div></div>`;
  if(list){
    const roofAcc=b.shafts.some(x=>shaftRoof(b,x));
    h+=`<div class="floors"><div class="frow ${k===N?'on':''}" data-act="fSel" data-k="${N}"><span class="num">R</span><span class="lb">Roof${roofAcc?' <em>· access</em>':''}</span></div>`;
    for(let i=N-1;i>=0;i--) h+=`<div class="frow ${k===i?'on':''}" data-act="fSel" data-k="${i}"><span class="num">${floorShort(b,i)}</span><span class="lb">${i===0?'Ground':'Floor '+i}</span><span class="acts"><button data-act="fCopyUp" data-k="${i}" title="Copy this layout to every floor above" aria-label="Copy layout up" ${i>=N-1?'disabled':''}>${I.up}</button><button data-act="fDup" data-k="${i}" title="Duplicate this floor" aria-label="Duplicate floor">${I.dup}</button><button data-act="fDel" data-k="${i}" title="Delete this floor" aria-label="Delete floor" ${N<=1?'disabled':''}>${I.del}</button></span></div>`;
    h+=`</div>`;
  }
  const sc=stackEl.querySelector('.floors')?.scrollTop||0;
  stackEl.innerHTML=h;
  const fl=stackEl.querySelector('.floors'); if(fl){ fl.scrollTop=sc; const on=fl.querySelector('.frow.on'); if(on){ const r=on.offsetTop, hh=fl.clientHeight; if(r<fl.scrollTop || r>fl.scrollTop+hh-30) fl.scrollTop=r-hh/2; } }
}
function updateHint(){
  const b=selB(), el=$('#hint');
  el.hidden = ui.mode!=='edit' || !!b;
  el.textContent='Click a building to edit it · drag to orbit · Shift-drag to pan · scroll to zoom';
}
function smartPlay(){ const b=selB(); if(b && ui.tab==='interior' && !isShell(b) && activeFloor(b)<b.floors.length) playHere(); else enterPlay(); }
function setTab(t, silent){ ui.tab=t; ui.sub=null; wallChain=null; hideHL(); tip.hidden=true; if(t!=='facade') ui.facadeTool=null; if(!silent) refreshChrome(); }
function setTool(t){ ui.tool=t; wallChain=null; dragItem=null; hideHL(); tip.hidden=true; canvas.style.cursor = t==='select'?'':'crosshair'; renderPanel(); }

function setPath(b,path,val){ const parts=path.split('.'); let o=b; for(let i=0;i<parts.length-1;i++) o=o[parts[i]]; o[parts.at(-1)]=val; }
function getPath(b,path){ return path.split('.').reduce((o,k)=>o[k], b); }
let sliding=false;
panel.addEventListener('click', e=>{
  const b=selB();
  const setEl=e.target.closest('[data-set]');
  if(setEl && b){ const path=setEl.dataset.set; let v=setEl.dataset.val; if(!isNaN(+v) && v!=='') v=+v; commit(()=>{ setPath(b,path,v); if(path.startsWith('style.') && ['windows','ground','wall','trim','roof'].includes(path.split('.')[1])) b.style.preset=null; }, null, b); renderPanel(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act;
  switch(act){
    case 'ptoggle': panel.classList.toggle('collapsed'); renderPanel(); break;
    case 'bmenu': ui.bmenu=!ui.bmenu; renderPanel(); renderStack(); break;
    case 'interior': { const sh=a.dataset.v==='shell'; if(sh!==isShell(b)){ commit(()=>{ b.interior=!sh; }, sh?'Shell only — facade with no interior':'Walk-in interior restored', b); ui.sub=null; refreshChrome(); } break; }
    case 'sel': ui.bmenu=false; selectBuilding(a.dataset.id); focusBuilding(bById(a.dataset.id)); break;
    case 'new': ui.bmenu=false; newBuilding(a.dataset.shape); break;
    case 'play': enterPlay(); break;
    case 'dup': ui.bmenu=false; duplicateBuilding(b); break;
    case 'focus': focusBuilding(b); break;
    case 'delB': ui.bmenu=false; deleteBuilding(b); break;
    case 'tab': setTab(a.dataset.tab); break;
    case 'shape': commit(()=>applyShape(b,a.dataset.shape), 'Footprint replaced', b); overlayRebuild(); renderPanel(); break;
    case 'rot90': commit(()=>rotate90(b), 'Rotated', b); overlayRebuild(); break;
    case 'style': { const k=a.dataset.style; commit(()=>{ b.style={...clone(STYLES[k]), preset:k}; }, STYLES[k].label+' applied', b); renderPanel(); break; }
    case 'ftool': ui.facadeTool = ui.facadeTool===a.dataset.t ? null : a.dataset.t; hideHL(); canvas.style.cursor=ui.facadeTool?'crosshair':''; renderPanel(); if(ui.facadeTool) toast(ui.facadeTool==='entrance'?'Click a ground-floor wall to add or remove an entrance':'Click a wall to switch its windows off or on'); break;
    case 'tool': setTool(a.dataset.t); break;
    case 'ptype': ui.propType=a.dataset.t; renderPanel(); break;
    case 'playHere': playHere(); break;
    case 'copyUp': { const k=activeFloor(b); commit(()=>{ for(let j=k+1;j<b.floors.length;j++) b.floors[j]=clone(b.floors[k]); }, `Layout copied to ${b.floors.length-1-k} floor${b.floors.length-2-k?'s':''}`, b); break; }
    case 'clearFloor': { const k=activeFloor(b); commit(()=>{ b.floors[k]=blankFloor(); }, floorLabel(b,k)+' cleared', b); renderPanel(); break; }
    case 'subDel': deleteSub(); break;
    case 'subRot': rotateSub(); break;
    case 'shRoof': { const sh=b.shafts.find(x=>x.id===ui.sub?.id); if(sh) commit(()=>{ sh.roof=a.checked; }, a.checked?'Now reaches the roof':'Stops at the top floor', b); break; }
    case 'shRoofI': { const sh=b.shafts.find(x=>x.id===a.dataset.id); if(sh) commit(()=>{ sh.roof=a.checked; }, null, b); renderStack(); break; }
  }
});
panel.addEventListener('toggle', e=>{ if(e.target.matches('details.more')) ui.moreOpen=e.target.open; }, true);
panel.addEventListener('input', e=>{
  const b=selB(); if(!b) return; const t=e.target;
  if(t.dataset.num){ if(!sliding){ pushUndo(); sliding=true; } const v=+t.value; setPath(b,t.dataset.num,v); if(t.dataset.num==='style.winW'||t.dataset.num==='style.bay') b.style.preset=null; t.nextElementSibling.textContent=v.toFixed(+t.dataset.dec)+t.dataset.unit; touch(b); }
  if(t.dataset.color){ if(!sliding){ pushUndo(); sliding=true; } setPath(b,t.dataset.color,t.value); b.style.preset=null; touch(b); }
});
panel.addEventListener('change', e=>{
  const b=selB(); const t=e.target;
  if(t.dataset.num||t.dataset.color){ sliding=false; if(t.dataset.color) renderPanel(); if(t.dataset.num==='groundHeight'||t.dataset.num==='floorHeight') renderPanel(); return; }
  if(!b) { return; }
  if(t.id==='bname'){ const v=t.value.trim()||b.name; commit(()=>{ b.name=v; }, null, b); renderPanel(); return; }
  if(t.id==='snapChk'){ ui.snap=t.checked; return; }
  if(t.dataset.bool){ commit(()=>setPath(b,t.dataset.bool,t.checked), null, b); return; }
  if(t.dataset.sh){ const sh=b.shafts.find(x=>x.id===ui.sub?.id); if(!sh) return; const v=+t.value;
    commit(()=>{ if(t.dataset.sh==='bottom'){ sh.bottom=v; if(sh.top>=0 && sh.top<v) sh.top=v; } else { sh.top=v; if(v>=0 && v<sh.bottom) sh.bottom=v; } }, null, b); renderPanel(); renderStack(); }
});
stackEl.addEventListener('click', e=>{
  const b=selB(); if(!b) return; const a=e.target.closest('[data-act]'); if(!a) return; const k=+a.dataset.k;
  switch(a.dataset.act){
    case 'fAdd': commit(()=>addFloorTop(b), 'Floor '+b.floors.length+' added', b); setActive(b,b.floors.length-1); refreshChrome(); break;
    case 'fRemove': if(b.floors.length>1){ commit(()=>deleteFloor(b,b.floors.length-1), 'Top floor removed', b); refreshChrome(); } break;
    case 'fSel': e.stopPropagation(); setTab('interior',true); setActive(b,k); refreshChrome(); break;
    case 'fCopyUp': e.stopPropagation(); { const n=b.floors.length-1-k; commit(()=>{ for(let j=k+1;j<b.floors.length;j++) b.floors[j]=clone(b.floors[k]); }, `${floorLabel(b,k)} copied to ${n} floor${n===1?'':'s'} above`, b); } break;
    case 'fDup': e.stopPropagation(); commit(()=>insertAbove(b,k), floorLabel(b,k)+' duplicated', b); setTab('interior',true); setActive(b,k+1); refreshChrome(); break;
    case 'fDel': e.stopPropagation(); if(b.floors.length>1){ const lbl=floorLabel(b,k); commit(()=>deleteFloor(b,k), lbl+' deleted — floors above moved down', b); setActive(b,Math.min(k,b.floors.length-1)); refreshChrome(); } break;
  }
});
stackEl.addEventListener('change', e=>{
  const b=selB(); if(!b) return;
  if(e.target.id==='fcount'){ const n=clamp(parseInt(e.target.value)||1,1,40); if(n!==b.floors.length){ const was=b.floors.length; commit(()=>setFloorCount(b,n), `${n} floors (${n>was?'+':''}${n-was})`, b); refreshChrome(); } }
});

const ov=$('#ov'); let ovItems=[];
const tmp3=new THREE.Vector3();
function overlayRebuild(){
  ov.innerHTML=''; ovItems=[];
  if(ui.mode!=='edit') return;
  if(!selB()){
  const sp=document.createElement('div'); sp.className='hd-s'; sp.title='Play spawn point — drag to move';
  sp.innerHTML='<svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><path d="M13 29s10-9.5 10-17A10 10 0 0 0 3 12c0 7.5 10 17 10 17z" fill="#1C2320"/><circle cx="13" cy="9" r="3" fill="#FF8A3D"/><path d="M8 18a5 5 0 0 1 10 0" fill="#FF8A3D"/></svg>';
  ov.appendChild(sp); ovItems.push({el:sp, pos:()=>tmp3.set(state.spawn.x,0,state.spawn.z)});
  handleDrag(sp, ()=>pushUndo(), p=>{ state.spawn=P(snapG(p.x),snapG(p.z)); saveSoon(); });
  }
  const b=selB(); if(!b || ui.tab!=='shape') return;
  const id=b.id;
  b.footprint.forEach((v,i)=>{
    const el=document.createElement('div'); el.className='hd-v'+(ui.vsel===i?' sel':''); el.title='Drag to move · double-click to remove';
    ov.appendChild(el); ovItems.push({el, pos:()=>{ const bb=bById(id), q=bb?.footprint[i]; return q ? tmp3.set(q.x+bb.pos.x,0,q.z+bb.pos.z) : null; }});
    handleDrag(el, ()=>{ pushUndo(); ui.vsel=i; ov.querySelectorAll('.hd-v').forEach((x,j)=>x.classList.toggle('sel',j===i)); }, (p,ev)=>{
      const bb=bById(id); let x=p.x-bb.pos.x, z=p.z-bb.pos.z;
      if(ui.snap && !ev.altKey){ x=snapG(x); z=snapG(z); const n=bb.footprint.length; for(const j of [(i-1+n)%n,(i+1)%n]){ const q=bb.footprint[j]; if(Math.abs(q.x-x)<0.4) x=q.x; if(Math.abs(q.z-z)<0.4) z=q.z; } }
      const q=bb.footprint[i]; if(q.x!==x||q.z!==z){ q.x=x; q.z=z; touch(bb); }
    }, ()=>renderPanel());
    el.addEventListener('dblclick', ev=>{ ev.stopPropagation(); const bb=bById(id); pushUndo(); if(removeVertex(bb,i)){ touch(bb); ui.vsel=-1; overlayRebuild(); renderPanel(); } else { undoStack.pop(); toast('A footprint needs at least 3 corners'); } });
    el.addEventListener('contextmenu', ev=>{ ev.preventDefault(); el.dispatchEvent(new MouseEvent('dblclick')); });
  });
  b.footprint.forEach((v,i)=>{
    const m=document.createElement('div'); m.className='hd-m'; m.textContent='+'; m.title='Drag to add a corner';
    ov.appendChild(m); ovItems.push({el:m, pos:()=>{ const bb=bById(id); if(!bb) return null; const a=bb.footprint[i], c=bb.footprint[(i+1)%bb.footprint.length]; return c ? tmp3.set((a.x+c.x)/2+bb.pos.x,0,(a.z+c.z)/2+bb.pos.z) : null; }});
    let ni=-1;
    handleDrag(m, ()=>{ const bb=bById(id); pushUndo(); ni=insertVertex(bb,i); touch(bb); }, (p,ev)=>{ const bb=bById(id); const q=bb.footprint[ni]; let x=p.x-bb.pos.x, z=p.z-bb.pos.z; if(ui.snap&&!ev.altKey){x=snapG(x);z=snapG(z);} q.x=x; q.z=z; touch(bb); }, ()=>{ ui.vsel=ni; overlayRebuild(); renderPanel(); });
    const len=document.createElement('div'); len.className='len'; ov.appendChild(len);
    ovItems.push({el:len, pos:()=>{ const bb=bById(id); if(!bb) return null; const a=bb.footprint[i], c=bb.footprint[(i+1)%bb.footprint.length]; if(!c) return null; const L=Math.hypot(c.x-a.x,c.z-a.z); const t=L.toFixed(1)+' m'; if(len.textContent!==t) len.textContent=t; const ccw=area2(bb.footprint)>0; const nx=(ccw?1:-1)*(c.z-a.z)/L, nz=(ccw?-1:1)*(c.x-a.x)/L; return tmp3.set((a.x+c.x)/2+bb.pos.x+nx*1.4,0,(a.z+c.z)/2+bb.pos.z+nz*1.4); }});
  });
  const ce=document.createElement('div'); ce.className='hd-c'; ce.title='Drag to move the building';
  ce.innerHTML='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5v15M1.5 9h15M9 1.5 6.8 3.7M9 1.5l2.2 2.2M9 16.5l-2.2-2.2M9 16.5l2.2-2.2M1.5 9l2.2-2.2M1.5 9l2.2 2.2M16.5 9l-2.2-2.2M16.5 9l-2.2 2.2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>';
  ov.appendChild(ce); ovItems.push({el:ce, pos:()=>{ const bb=bById(id); if(!bb) return null; const c=centroid(bb.footprint); return tmp3.set(c.x+bb.pos.x,0,c.z+bb.pos.z); }});
  let off=null;
  handleDrag(ce, ()=>{ pushUndo(); off=null; }, (p)=>{ const bb=bById(id); if(!off) off=P(bb.pos.x-p.x,bb.pos.z-p.z); const nx=snapG(p.x+off.x), nz=snapG(p.z+off.z); if(nx!==bb.pos.x||nz!==bb.pos.z){ bb.pos=P(nx,nz); touch(bb); } });
}
function handleDrag(el, onStart, onMove, onEnd){
  let active=false;
  el.addEventListener('pointerdown', e=>{ if(e.button!==0) return; e.stopPropagation(); e.preventDefault(); el.setPointerCapture(e.pointerId); active=true; ov.classList.add('dragging'); onStart&&onStart(); });
  el.addEventListener('pointermove', e=>{ if(!active) return; const v=rayY(e,0); if(v) onMove(v,e); });
  const end=()=>{ if(!active) return; active=false; ov.classList.remove('dragging'); saveSoon(); onEnd&&onEnd(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function overlayUpdate(){
  const w=canvas.clientWidth, h=canvas.clientHeight;
  for(const it of ovItems){ const v=it.pos(); if(!v){ it.el.style.display='none'; continue; } v.project(camera); if(v.z>1||v.z<-1){ it.el.style.display='none'; continue; } it.el.style.display=''; it.el.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px)`; }
}

/* =========================================================================

let toastT=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 1800); }
function refreshChrome(){
  const play=ui.mode==='play';
  $('#mEdit').classList.toggle('on',!play); $('#mPlay').classList.toggle('on',play);
  $('#mEdit').setAttribute('aria-selected',!play); $('#mPlay').setAttribute('aria-selected',play);
  panel.hidden=play; $('#editTb').hidden=play; $('#hud').hidden=!play; updateHint();
  { const b=selB(); $('#mPlay').title = !play && b && ui.tab==='interior' && !isShell(b) && activeFloor(b)<b.floors.length ? 'Play from '+floorLabel(b,activeFloor(b))+' (P)' : 'Play from the street (P)'; }
  if(play){ stackEl.hidden=true; renderOcc(); ov.innerHTML=''; ovItems=[]; }
  else { renderPanel(); renderStack(); overlayRebuild(); canvas.style.cursor=(ui.tab==='interior'&&ui.tool!=='select')||(ui.tab==='facade'&&ui.facadeTool)?'crosshair':''; }
  updateUndoBtns();
}
$('#mEdit').onclick=exitPlay; $('#mPlay').onclick=smartPlay;
$('#bUndo').onclick=undo; $('#bRedo').onclick=redo;
function openModal(html){ const m=$('#modal'); m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; }
function closeModal(){ $('#modal').hidden=true; }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal'||e.target.closest('[data-close]')) closeModal(); });
$('#bHelp').onclick=()=>{ openModal(`<h2>Shortcuts & data</h2><table>
<tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Shape · Facade · Interior</td></tr>
<tr><td><kbd>[</kbd> <kbd>]</kbd> or PgDn/PgUp</td><td>Step down / up through floors</td></tr>
<tr><td><kbd>+</kbd> <kbd>−</kbd></td><td>Add a floor on top (copies the top floor) / remove the top floor</td></tr>
<tr><td><kbd>V</kbd> <kbd>W</kbd> <kbd>D</kbd> <kbd>X</kbd></td><td>Select · Wall · Door · Erase</td></tr>
<tr><td><kbd>S</kbd> <kbd>L</kbd> <kbd>F</kbd></td><td>Stairs · Lift · Furnish</td></tr>

<tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd></td><td>Undo / redo</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>D</kbd></td><td>Duplicate building</td></tr>

</table><div class="row" style="margin-top:14px"><button class="btn" id="hData">Layout JSON…</button><span style="flex:1"></span><button class="btn pri" data-close>Close</button></div>`); $('#hData').onclick=openData; };
function openData(){ openModal(`<h2>Layout data</h2><p class="note" style="margin:0 0 10px">This is the full editor state — the same shape the Unity data model is specced against. Copy it to share a layout, or paste one in and load it.</p><textarea id="jsonTa" spellcheck="false">${esc(JSON.stringify(state,null,1))}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn" id="jCopy">Copy</button><button class="btn" id="jLoad">Load pasted JSON</button><button class="btn danger ghost" id="jReset">Reset to demo</button><span class="spacer" style="flex:1"></span><button class="btn pri" data-close>Close</button></div>`);
  $('#jCopy').onclick=()=>{ const ta=$('#jsonTa'); navigator.clipboard?.writeText(ta.value).then(()=>toast('Copied'),()=>{ ta.select(); toast('Press Ctrl+C to copy'); }) ?? (ta.select(), toast('Press Ctrl+C to copy')); };
  $('#jLoad').onclick=()=>{ try{ const o=JSON.parse($('#jsonTa').value); if(!o||!Array.isArray(o.buildings)) throw 0; pushUndo(); state=o; state.v=2; state.seq=Math.max(state.seq||1, 1000); afterRestore('Layout loaded'); closeModal(); }catch(e){ toast('That JSON is not a layout — check it starts with {"v":2'); } };

/* =========================================================================
   Main loop
   ========================================================================= */
function resize(){ const w=canvas.clientWidth, h=canvas.clientHeight; if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); } }
let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  resize();
  for(const id of dirty){ const b=bById(id); if(b) rebuild(b); } dirty.clear();
  if(ui.mode==='play'){ updatePlayer(dt); updateHUD(); updateLiftUI(); applyCam(camPlay); }
  else {
    const b=selB(); const inInt = b && ui.tab==='interior' && !isShell(b); const desY = inInt ? floorBase(b,activeFloor(b)) : 0;
    camEdit.target.y += (desY-camEdit.target.y)*Math.min(1,dt*8); applyCam(camEdit);
    if(inInt){ const bb=bbox(b.footprint); const sx=Math.ceil((bb.x1-bb.x0)+2), sz=Math.ceil((bb.z1-bb.z0)+2), s=Math.max(sx,sz); const key=b.id+s; if(key!==flGridKey){ scene.remove(flGrid); flGrid.geometry.dispose(); const g=new THREE.GridHelper(s, s*2, '#DD5A12', '#8E968C'); flGrid.geometry=g.geometry; flGrid.material=g.material; flGrid.material.transparent=true; flGrid.material.opacity=0.3; flGrid.material.depthWrite=false; scene.add(flGrid); flGridKey=key; }
      flGrid.visible = activeFloor(b)<b.floors.length; flGrid.position.set((bb.x0+bb.x1)/2+b.pos.x, floorBase(b,activeFloor(b))+0.03, (bb.z0+bb.z1)/2+b.pos.z); }
    else flGrid.visible=false;
    if(ui.sub && b && ui.tab==='interior' && !dragItem && ui.tool==='select'){ const k=activeFloor(b); const s=ui.sub; if(s.kind==='shaft'){ const sh=b.shafts.find(x=>x.id===s.id); if(sh && shaftLevels(b,sh).includes(k)) showTarget(b,k,{kind:'shaft',s:sh},'#2F7D4F'); } else if(s.floor===k){ if(s.kind==='prop') showTarget(b,k,{kind:'prop',i:s.i},'#2F7D4F'); if(s.kind==='wall') showTarget(b,k,{kind:'wall',wi:s.i},'#2F7D4F'); } }
    overlayUpdate();
  }
  const f=G.uFocus.value; sun.position.set(f.x+30, f.y+60, f.z+18); sun.target.position.set(f.x, f.y, f.z);
  applyView();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

/* boot */
state = loadState();
buildWorld();
touch();
ui.sel = state.buildings[0]?.id || null;
refreshChrome();
requestAnimationFrame(tick);
window.__sb = { geo:(i)=>{ const b=state.buildings[i]; DEBUG_SOLIDS=true; const g=buildGeometry(b); DEBUG_SOLIDS=false; return g.levels.map(L=>({p:L.op.p,n:L.op.n,c:L.op.c,i:L.op.i,solids:L.op.solids})); }, nb:()=>state.buildings.length, bench:()=>{ const b=state.buildings[0]; const t=performance.now(); for(let i=0;i<10;i++) buildGeometry(b); return (performance.now()-t)/10; }, sim:(n,dt,k)=>{ Object.assign(keys,k||{}); for(let i=0;i<n;i++) updatePlayer(dt); for(const c in k||{}) keys[c]=false; return {x:+player.x.toFixed(2),y:+player.y.toFixed(2),z:+player.z.toFixed(2)}; }, liftHere:()=>{ const L=liftHere(); return L && L.s.id; }, loc:()=>{ const l=playerLoc(); return l.b ? l.b.name+':'+l.floor : 'out'; }, get state(){return state;}, ui, enterPlay, exitPlay, setTab, setTool, stepFloor, selectBuilding, player, camEdit, camPlay, playHere, setFloorCount:(n)=>{ const b=selB(); commit(()=>setFloorCount(b,n),null,b); refreshChrome(); } };
